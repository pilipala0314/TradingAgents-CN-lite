# Pre-commit hooks — 提交前自动跑 ruff format / lint / 测试相关检查
#
# 安装：  pip install pre-commit
#         pre-commit install
# 手动跑：pre-commit run --all-files
# 跳过：  git commit --no-verify

# 同步 .pre-commit-config.yaml 锁定的工具版本与 pyproject.toml

repos:
  # ── 通用：行尾/空白/大文件/密钥 ───────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── ruff：替代 black + isort + flake8 ──────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      # 格式化（替代 black）
      - id: ruff-format
        types_or: [python, pyi]
      # lint（含 isort / pyflakes / bugbear）
      - id: ruff
        types_or: [python, pyi]
        args: [--fix, --exit-non-zero-on-fix]

  # ── mypy：核心模块类型检查（可选；项目目前未全面注解，先关掉）──
