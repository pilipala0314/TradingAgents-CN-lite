# GitHub Actions CI — 跑 lint + test 在 PR / push 时
#
# 启用：在 GitHub 仓库的 Settings → Actions → Runners 选默认 ubuntu-latest 即可。
# 需要 PostgreSQL / Redis 服务的测试用 docker-compose 拉起。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── 取消上一次未完成的同 workflow run ──
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint ───────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.5.0"
      - name: ruff format check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .

  # ── 2. Test（unit + integration）─────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ashare_agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/ashare_agent_test
      REDIS_URL: redis://localhost:6379/0
      LLM_API_KEY: dummy
      LLM_PROVIDER: openai
      OPENAI_API_KEY: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,scheduler,tdx,stealth]"
      - name: Run migrations
        run: |
          alembic upgrade head
      - name: Run tests
        run: |
          pytest --cov --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ── 3. Smoke（健康检查） ─────────────────────────────────────
  smoke:
    name: Smoke (Docker Compose)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Bring up stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8765/health?mode=summary; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
