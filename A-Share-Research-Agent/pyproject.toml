[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# ──────────────────────────────────────────────────────────────────────
# Project 元信息
# ──────────────────────────────────────────────────────────────────────

[project]
name = "a-share-research-agent"
version = "0.2.0"
description = "可路由、可插拔、零降级的 A 股多源数据 + 多 Agent 协同研究平台"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "A-Share Research Agent Contributors" }
]
keywords = ["a-share", "akshare", "trading", "agent", "langgraph", "data-pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.10"

# ── 核心依赖（运行必需） ─────────────────────────────────────────────

dependencies = [
    # Web / API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    # DB
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # LLM / Agent
    "langgraph>=0.0.26",
    "langchain-openai>=0.0.8",
    # 数据源
    "akshare>=1.13.0",
    "pandas>=2.2.0",
]

# ── 可选依赖组 ───────────────────────────────────────────────────────

[project.optional-dependencies]
# 开发工具：lint / format / type check / test
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-requests",
]
# 任务调度（Celery + Redis + Flower）
scheduler = [
    "celery>=5.4.0",
    "redis>=5.0.0",
    "flower>=2.0.0",
    "apscheduler>=3.10.0",
]
# TDX 财务数据源（mootdx）
tdx = [
    "mootdx>=1.4.0",
    "httpx<0.26.0",  # mootdx 兼容性要求（参见 project_memory.md）
    "curl-cffi>=0.6.0",
]
# 反爬补丁（curl_cffi 走 chromium 指纹，绕过东财反爬）
stealth = [
    "curl-cffi>=0.6.0",
]
# 全部可选依赖
all = [
    "a-share-research-agent[dev,scheduler,tdx,stealth]",
]

# ── 入口点（CLI） ────────────────────────────────────────────────────

[project.scripts]
# 暂不暴露 CLI，预留

[project.urls]
# 仓库链接（待真实仓库就绪后更新）
"Source" = "https://github.com/example/a-share-research-agent"
"Issues" = "https://github.com/example/a-share-research-agent/issues"
"Documentation" = "https://github.com/example/a-share-research-agent#readme"

# ──────────────────────────────────────────────────────────────────────
# 工具配置
# ──────────────────────────────────────────────────────────────────────

# ── pytest ────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-q",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "integration: 集成测试（需要外网）",
    "slow: 慢测试（>1s）",
    "unit: 纯单元测试（不依赖外网）",
]
# 覆盖率配置
[tool.coverage.run]
source = ["agents", "apps", "core", "data_pipeline", "features_engine", "graph", "rule_engine", "services"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ── ruff（替代 black + isort + flake8） ───────────────────────────────

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["agents", "apps", "core", "data_pipeline", "features_engine", "graph", "models", "rule_engine", "schemas", "services", "tests"]
extend-exclude = ["alembic/versions", "examples", "docs"]

[tool.ruff.lint]
# 选择规则集
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff specific
]
ignore = [
    "E501",  # line too long（由 line-length 控制）
    "B008",  # function call in default argument（FastAPI Depends 常用）
    "RUF012", # mutable class attributes（dataclass / class var 常用）
    # 中文字符是项目内合法字符（不混用全/半角），RUF001/002/003 误报
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许未使用导入（fixture）+ 一行 stub（紧凑）
"tests/*" = ["F401", "F811", "N801", "N802", "N803", "N806", "N815", "B011", "B017", "SIM", "UP", "C4", "RUF", "E702", "F841"]
# __init__.py 允许未使用导入（re-export）
"**/__init__.py" = ["F401"]
# 端到端验证脚本（一次性跑，风格不要求严格）
"scripts/*" = ["E501", "N", "B", "SIM", "C4", "RUF", "UP", "I", "F401"]
# alembic 迁移由 alembic 生成
"alembic/**" = ["E", "W", "F", "I", "N", "B", "C4", "SIM", "RUF", "UP"]
# data_router 的 _AP 别名（AdaptedProvider 缩写，type-hint 用）
"data_pipeline/data_router.py" = ["N814"]
# resilience 子模块已有别名约定
"data_pipeline/resilience/*" = ["N818"]
# core/llm 的 LLMUnavailable 是公开 API（被 agents/base.py + tests + __init__.py 引用），
# 重命名影响面大；保持现状 + noqa
"core/llm/*" = ["N818"]
# services/backtest_engine._pick_rebalance_dates 故意用 if/else 写周/月 key，
# 三元表达式会调用两次 d.isocalendar()，可读性更差
"services/backtest_engine.py" = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "apps", "core", "data_pipeline", "features_engine", "graph", "models", "rule_engine", "schemas", "services"]

# ── mypy（类型检查，可选） ────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false  # 项目目前未全面类型注解，先放宽
disallow_untyped_defs = false
exclude = ["alembic/", "docs/", "examples/"]

# ── setuptools 打包 ───────────────────────────────────────────────────

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents",
    "agents.*",
    "apps",
    "apps.*",
    "core",
    "core.*",
    "data_pipeline",
    "data_pipeline.*",
    "features_engine",
    "features_engine.*",
    "graph",
    "graph.*",
    "models",
    "models.*",
    "prompts",
    "prompts.*",
    "rule_engine",
    "rule_engine.*",
    "schemas",
    "schemas.*",
    "services",
    "services.*",
]
exclude = ["tests*", "alembic*", "docs*", "examples*"]
