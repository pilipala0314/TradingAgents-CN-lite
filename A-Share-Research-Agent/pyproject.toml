[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-research-agent"
version = "0.1.0"
description = "A 股研究智能体系统 — 多源数据路由 + 多因子融合 + 解读智能体（T-1 板块/大盘报告）"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "A-Share Research Agent Contributors" }]
keywords = ["a-share", "research-agent", "multi-factor", "sector", "indicator-pack", "datasource"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.10"

dependencies = [
    # 数据获取核心
    "akshare>=1.18.0,<1.19.0",  # 锁定版本范围，防止升级破坏接口（1.18.64 已移除多个旧接口）
    "pandas>=2.2.0",
    "httpx>=0.25.0,<0.28.0",    # 下限 0.25 以兼容 mootdx 0.11.x 的 httpx<0.26 约束
    "requests>=2.31.0",
    # 层间共享 schema（指标包/结论包/溯源契约）
    "pydantic>=2.0,<3.0",
    # 因子注册表（设计时 YAML 产物）
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 专业数据源（缺失时 provider 会给出明确安装提示）
pro = ["tushare>=1.4.0", "baostock>=0.8.9"]
# a_stock_data provider（通达信行情）
tdx = ["mootdx>=0.11.7"]
# 校准脚本（回写 YAML 需保留注释，用 ruamel 做 round-trip）
calib = ["ruamel.yaml>=0.17"]

[tool.setuptools.packages.find]
# datasource: L1 数据源层（自包含，可整目录复制独立运行）
# foundation:  横切基座（层间共享 schema 等，被 L1-L5 依赖）
# indicators:  L2 指标层（源级融合 → IndicatorPack）
include = ["datasource*", "foundation*", "indicators*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: 纯函数/无 IO 单测",
    "integration: 依赖真实网络或 SDK 的集成测试",
]
